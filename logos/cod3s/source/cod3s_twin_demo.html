<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo COD3S animé</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; font-family: 'Open Sans', sans-serif; background: #0F141A; color: #E6EAF0; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: #9AA6B6; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; }
  .card { border-radius: 12px; padding: 28px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 260px; }
  .card.dark { background: #1A2230; }
  .card.light { background: #FFFFFF; color: #1F416D; }
  .card .cap { font-size: 12px; opacity: 0.7; }
  .card .title { font-size: 18px; font-weight: 600; }
  button { font: inherit; font-size: 14px; padding: 8px 18px; border-radius: 8px; border: 0; background: #EF7B26; color: #fff; cursor: pointer; margin: 0 0 20px; }
  canvas { display: block; }
</style>
</head>
<body>
<main>
  <h1>Logo COD3S : affichage animé</h1>
  <p class="lead">Les nuées partent du demi-cube bleu et construisent les arêtes orange en 3 s environ. Ensuite, des points filants parcourent les arêtes au hasard.</p>
  <button id="replay">Rejouer</button>
  <div class="row">
    <div class="card dark"><canvas data-size="60" data-theme="dark"></canvas><div class="title">Connexion</div><div class="cap">carte sombre, 60 px</div></div>
    <div class="card light"><canvas data-size="60" data-theme="light"></canvas><div class="title">Connexion</div><div class="cap">carte claire, 60 px</div></div>
    <div class="card dark"><canvas data-size="260" data-theme="dark"></canvas><div class="cap">symbole en grand, 260 px</div></div>
    <div class="card light"><canvas data-size="260" data-theme="light"></canvas><div class="cap">symbole en grand, 260 px</div></div>
  </div>
</main>
<script>
// Prototype v2 of the COD3S logo animation (2026-11-08).
// Build: a fixed (seeded) cloud of points flies from the blue half and condenses
// into solid orange edges in ~3 s. Then truly random pulses run along the edges.
(() => {
  const PAL = {
    dark: { blue: '#5B9BD5', mid: '#8FB3DC', orange: '#EF7B26', osoft: '#F5A76A', exch: '#8FB3DC', pulse: '#1F416D' },
    light: { blue: '#1F416D', mid: '#4F7DB5', orange: '#EF7B26', osoft: '#F5A76A', exch: '#4F7DB5', pulse: '#132A47' },
  }
  const S = 34, K = 0.866 * S, C = [50, 50]
  const G = {
    top: [50, 50 - S], ul: [50 - K, 50 - S / 2], ur: [50 + K, 50 - S / 2], ctr: C,
    ll: [50 - K, 50 + S / 2], lr: [50 + K, 50 + S / 2], bot: [50, 50 + S],
  }
  const W = 1.2 // edge width, view box units
  const BUILD_MS = 3000
  const REAL_FADE_MS = 300
  const PULSE_MS = 450

  function rng(seed) {
    let a = seed >>> 0
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a)
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
  }
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]
  const normal = (a, b) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]); return [-(b[1] - a[1]) / L, (b[0] - a[0]) / L] }

  // Edges of the twin. Contour edges are drawn on the silhouette, 2W wide and
  // clipped to the right half, so the outer border meets the blue half exactly.
  const EDGES = [
    { a: G.top, b: G.ur, contour: true },
    { a: G.ur, b: G.lr, contour: true },
    { a: G.lr, b: G.bot, contour: true },
    { a: G.ur, b: G.ctr, contour: false },
    // Along the seam, inside the right half: the twin's two edges against the blue half.
    { a: G.ctr, b: G.top, contour: true },
    { a: G.bot, b: G.ctr, contour: true },
  ]
  const SEGMENTS = 34 // per edge
  const RIGHT_HALF = [G.top, G.ur, G.lr, G.bot]
  const REAL_FACES = [
    { pts: [G.ul, G.ctr, G.bot, G.ll], key: 'blue' },
    { pts: [G.top, G.ctr, G.ul], key: 'mid' },
  ]

  // Centre lines of the band, for the pulses.
  function inset(a, b, d) { const n = normal(a, b); return [[a[0] + n[0] * d, a[1] + n[1] * d], [b[0] + n[0] * d, b[1] + n[1] * d]] }
  function intersect([p1, p2], [p3, p4]) {
    const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0])
    const a = p1[0] * p2[1] - p1[1] * p2[0], b = p3[0] * p4[1] - p3[1] * p4[0]
    return [(a * (p3[0] - p4[0]) - (p1[0] - p2[0]) * b) / d, (a * (p3[1] - p4[1]) - (p1[1] - p2[1]) * b) / d]
  }
  const seamLine = [G.top, G.bot]
  const l0 = inset(G.top, G.ur, W / 2), l1 = inset(G.ur, G.lr, W / 2), l2 = inset(G.lr, G.bot, W / 2)
  const c0 = intersect(seamLine, l0), c1 = intersect(l0, l1), c2 = intersect(l1, l2), c3 = intersect(l2, seamLine)
  const seamIn = inset(G.ctr, G.top, W / 2)
  const s0 = intersect(seamIn, l0), s2 = intersect(seamIn, l2), sm = [50 + W / 2, 50]
  const TRACKS = [[s0, c1], [c1, c2], [c2, s2], [c1, sm], [s0, sm], [sm, s2]]

  // The build plan: identical at every display.
  function pointInTri(r, A, B, Cc) { let u = r(), v = r(); if (u + v > 1) { u = 1 - u; v = 1 - v }
    return [A[0] + (B[0] - A[0]) * u + (Cc[0] - A[0]) * v, A[1] + (B[1] - A[1]) * u + (Cc[1] - A[1]) * v] }
  function plan() {
    const r = rng(7), particles = [], segCount = new Array(EDGES.length * SEGMENTS).fill(0)
    const N = 2400
    for (let i = 0; i < N; i++) {
      const e = Math.floor(r() * EDGES.length), edge = EDGES[e]
      const s = r(), seg = Math.min(SEGMENTS - 1, Math.floor(s * SEGMENTS))
      const n = normal(edge.a, edge.b), base = lerp(edge.a, edge.b, s)
      const off = edge.contour ? r() * W * 0.95 : (r() - 0.5) * W * 0.9
      const tx = base[0] + n[0] * off, ty = base[1] + n[1] * off
      // Origins inside the blue half, a little denser near the seam.
      const tri = r() < 0.55 ? [G.ll, G.ctr, G.bot] : r() < 0.6 ? [G.ul, G.ctr, G.ll] : [G.top, G.ctr, G.ul]
      let [ox, oy] = pointInTri(r, ...tri)
      ox = 50 - (50 - ox) * Math.pow(r(), 0.35)
      // Edges near the seam build a little earlier, the far corner last.
      const far = (tx - 50) / K
      const duration = 520 + r() * 900
      const latest = BUILD_MS - duration
      const delay = Math.min(latest, 120 + far * 650 + Math.pow(r(), 1.3) * 1500)
      const ang = r() * Math.PI * 2, amp = 4 + r() * 14
      particles.push({ e, seg, tx, ty, ox, oy, cx: (ox + tx) / 2 + Math.cos(ang) * amp, cy: (oy + ty) / 2 + Math.sin(ang) * amp,
        delay, duration, rad: 0.18 + Math.pow(r(), 2.2) * 0.6, op: 0.25 + r() * 0.75, soft: r() < 0.3 })
      segCount[e * SEGMENTS + seg]++
    }
    return { particles, segCount }
  }
  const PLAN = plan()

  function mount(canvas) {
    const size = Number(canvas.dataset.size), pal = PAL[canvas.dataset.theme]
    const dpr = window.devicePixelRatio || 1
    const margin = Math.round(size * 0.25)
    canvas.width = (size + 2 * margin) * dpr; canvas.height = (size + 2 * margin) * dpr
    canvas.style.width = `${size + 2 * margin}px`; canvas.style.height = `${size + 2 * margin}px`
    canvas.style.margin = `${-margin}px`
    const ctx = canvas.getContext('2d'), scale = (size / 100) * dpr
    let start = performance.now(), pulses = [], nextPulse = BUILD_MS + 300, raf = 0

    function path(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath() }

    function frame(now) {
      const t = now - start
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.setTransform(scale, 0, 0, scale, margin * dpr, margin * dpr)
      // Real half.
      ctx.globalAlpha = Math.min(1, t / REAL_FADE_MS)
      for (const f of REAL_FACES) { path(f.pts); ctx.fillStyle = pal[f.key]; ctx.fill() }
      // Edges, segment by segment, as their points land.
      const landed = new Array(PLAN.segCount.length).fill(0)
      for (const p of PLAN.particles) if (t >= p.delay + p.duration) landed[p.e * SEGMENTS + p.seg]++
      ctx.save(); path(RIGHT_HALF); ctx.clip()
      ctx.strokeStyle = pal.orange; ctx.lineCap = 'butt'
      const done = t >= BUILD_MS
      if (done) {
        ctx.globalAlpha = 1; ctx.lineJoin = 'miter'
        ctx.lineWidth = 2 * W; ctx.beginPath(); ctx.moveTo(...G.top); ctx.lineTo(...G.ur); ctx.lineTo(...G.lr); ctx.lineTo(...G.bot); ctx.stroke()
        ctx.lineWidth = W; ctx.beginPath(); ctx.moveTo(...G.ur); ctx.lineTo(...G.ctr); ctx.stroke()
        ctx.lineWidth = 2 * W; ctx.beginPath(); ctx.moveTo(...G.top); ctx.lineTo(...G.bot); ctx.stroke()
      } else {
        EDGES.forEach((edge, e) => {
          ctx.lineWidth = edge.contour ? 2 * W : W
          for (let s = 0; s < SEGMENTS; s++) {
            const i = e * SEGMENTS + s, f = PLAN.segCount[i] ? landed[i] / PLAN.segCount[i] : 1
            if (!f) continue
            ctx.globalAlpha = Math.pow(f, 1.6)
            const a = lerp(edge.a, edge.b, s / SEGMENTS), b = lerp(edge.a, edge.b, (s + 1) / SEGMENTS + 0.004)
            ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke()
          }
        })
      }
      ctx.restore()
      // Flying points.
      if (!done) {
        for (const p of PLAN.particles) {
          const k = (t - p.delay) / p.duration
          if (k <= 0 || k >= 1) continue
          const e = 1 - Math.pow(1 - k, 2.4)
          const x = (1 - e) * (1 - e) * p.ox + 2 * (1 - e) * e * p.cx + e * e * p.tx
          const y = (1 - e) * (1 - e) * p.oy + 2 * (1 - e) * e * p.cy + e * e * p.ty
          ctx.globalAlpha = p.op * Math.min(1, k * 6) * (1 - Math.pow(k, 6))
          ctx.fillStyle = p.soft ? pal.osoft : pal.orange
          ctx.beginPath(); ctx.arc(x, y, p.rad * (0.6 + 0.4 * k), 0, Math.PI * 2); ctx.fill()
        }
      }
      // Pulses: truly random, after the build.
      if (done) {
        while (t >= nextPulse) {
          const tr = TRACKS[Math.floor(Math.random() * TRACKS.length)]
          pulses.push(Math.random() < 0.5 ? { a: tr[0], b: tr[1], start: nextPulse } : { a: tr[1], b: tr[0], start: nextPulse })
          nextPulse += 1800 + Math.random() * 2800
        }
        pulses = pulses.filter((p) => t - p.start < PULSE_MS)
        for (const p of pulses) {
          const u = (t - p.start) / PULSE_MS
          for (let j = 0; j < 24; j++) {
            const v = u - j * 0.022
            if (v < 0 || v > 1) continue
            const [x, y] = lerp(p.a, p.b, v)
            ctx.globalAlpha = Math.min(1, Math.sin(Math.PI * u) * 1.6) * Math.pow(1 - j / 24, 1.4) * 0.95
            ctx.fillStyle = pal.pulse
            ctx.beginPath(); ctx.arc(x, y, W * 0.42 * (1 - j / 34), 0, Math.PI * 2); ctx.fill()
          }
        }
      }
      ctx.globalAlpha = 1
      raf = requestAnimationFrame(frame)
    }
    raf = requestAnimationFrame(frame)
    return () => { cancelAnimationFrame(raf); start = performance.now(); pulses = []; nextPulse = BUILD_MS + 300; raf = requestAnimationFrame(frame) }
  }

  const replays = [...document.querySelectorAll('canvas')].map(mount)
  document.getElementById('replay').addEventListener('click', () => replays.forEach((f) => f()))
})()
</script>
</body>
</html>
